# ╔══════════════════════════════════════════════════════╗
# ║   BIENVENIDA DE BRAINIAC                            ║
# ║                                                      ║
# ║   Cuando alguien crea un issue, Brainiac responde    ║
# ║   de inmediato confirmando que lo está revisando     ║
# ║   y envía un correo de aviso a Ignacio.               ║
# ╚══════════════════════════════════════════════════════╝
#
# Secrets necesarios en Settings → Secrets and variables → Actions:
#   MAIL_USERNAME  → cuenta de Gmail que envía (ej. brainiac@gmail.com)
#   MAIL_PASSWORD  → contraseña de aplicación de esa cuenta de Gmail
#   MAIL_SERVER    → (opcional) servidor SMTP, por defecto smtp.gmail.com
#   MAIL_PORT      → (opcional) puerto SMTP, por defecto 465

name: 🤖 Bienvenido Brainiac

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  responder-issue:
    name: Brainiac revisa el issue
    runs-on: ubuntu-latest

    steps:
      - name: Comentario de bienvenida de Brainiac
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const autor = context.payload.issue.user.login;
            const numero = context.payload.issue.number;
            const titulo = context.payload.issue.title;

            const mensaje = [
              `🧠 **Saludos, @${autor}.**`,
              '',
              `Tu issue **#${numero}** ha sido detectado por Brainiac y está siendo revisado por el Consejo de la Legión del Mal.`,
              '',
              '> "Toda información será analizada, clasificada y almacenada en la base lunar. La paciencia es una virtud... incluso para los villanos."',
              '',
              `⏳ **Título:** ${titulo}`,
              '⏳ **Estado:** En revisión por Brainiac',
              '📡 **Prioridad:** Pendiente de clasificación',
              '',
              '_Este mensaje fue generado automáticamente por los sistemas de vigilancia de la Legión._'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: numero,
              body: mensaje
            });

      - name: Enviar correo de aviso a Ignacio
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          # Servidor SMTP de Gmail. Se puede cambiar con los secrets
          # MAIL_SERVER y MAIL_PORT si se usa otro proveedor.
          server_address: "${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}"
          server_port: "${{ secrets.MAIL_PORT || 465 }}"
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🧠 Nuevo issue #${{ github.event.issue.number }} en ${{ github.repository }}"
          to: ignacio.truegandur@gmail.com
          from: "Brainiac <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Saludos, Ignacio.

            Brainiac ha detectado un nuevo issue en la Legión del Mal.

            Repositorio: ${{ github.repository }}
            Issue: #${{ github.event.issue.number }} - ${{ github.event.issue.title }}
            Autor: @${{ github.event.issue.user.login }}
            Estado: En revisión por Brainiac
            Enlace: ${{ github.event.issue.html_url }}

            Descripción:
            ${{ github.event.issue.body }}

            --
            Sistemas de vigilancia de la Legión del Mal
